[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "nerva-sympy"
version = "1.0.0"
description = "Validation of neural network equations in SymPy."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Wieger Wesselink", email = "j.w.wesselink@tue.nl" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Boost Software License 1.0 (BSL-1.0)",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy >= 1.21",
  "sympy >= 1.9",
]

# The symbolic validation only needs numpy and sympy. The numerical backends are only needed
# to compare their implementations with the symbolic reference, so they are optional.
[project.optional-dependencies]
jax = ["nerva-jax >= 1.0.0"]
numpy = ["nerva-numpy >= 1.0.0"]
tensorflow = ["nerva-tensorflow >= 1.0.0"]
torch = ["nerva-torch >= 1.0.0"]
all = [
  "nerva-jax >= 1.0.0",
  "nerva-numpy >= 1.0.0",
  "nerva-tensorflow >= 1.0.0",
  "nerva-torch >= 1.0.0",
]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/wiegerw/nerva-sympy"
"Bug Tracker" = "https://github.com/wiegerw/nerva-sympy/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The cross-framework tests need all four backends; they only run when requested explicitly,
# e.g. with pytest tests/cross_framework, or python tests/run_all_tests.py --run --cross-framework.
# The other entries are the pytest defaults.
norecursedirs = ["cross_framework", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
markers = [
  "slow: tests that take a long time (run with --include-long in tests/run_all_tests.py, or pytest -m slow)",
]
