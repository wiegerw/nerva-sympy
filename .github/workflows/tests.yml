name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks that the layer equations in the source code of the backends match the
  # validated SymPy equations, and runs the one-layer reference cases. The backends
  # are checked out as siblings of nerva-sympy; their frameworks are not needed.
  equations:
    name: Equation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nerva-sympy
      - uses: actions/checkout@v4
        with:
          repository: wiegerw/nerva-numpy
          path: nerva-numpy
      - uses: actions/checkout@v4
        with:
          repository: wiegerw/nerva-jax
          path: nerva-jax
      - uses: actions/checkout@v4
        with:
          repository: wiegerw/nerva-tensorflow
          path: nerva-tensorflow
      - uses: actions/checkout@v4
        with:
          repository: wiegerw/nerva-torch
          path: nerva-torch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./nerva-sympy[test]"
      - name: Run tests
        run: python -m pytest nerva-sympy/tests/test_equations.py nerva-sympy/tests/test_one_layer.py -ra

  # Runs the symbolic tests with only numpy and sympy installed. The cross-framework
  # tests are skipped, because they need all four backends.
  symbolic:
    name: Symbolic tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Show versions
        run: python -m pip list
      - name: Run tests
        run: python -m pytest tests -ra
